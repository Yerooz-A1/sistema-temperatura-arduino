name: Assemble and publish Windows installer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-release.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download release parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.0
        run: |
          mkdir parts
          gh release download "$TAG" --pattern 'SistemaTemperatura.part*' --dir parts
      - name: Join and verify installer
        run: |
          cat parts/SistemaTemperatura.part01 parts/SistemaTemperatura.part02 parts/SistemaTemperatura.part03 > SistemaTemperatura-Instalador.exe
          test "$(stat -c%s SistemaTemperatura-Instalador.exe)" = "176067584"
          echo "655d9aab21a6fea4c9fe64f2d21322207a9a4274268c87267816f3975250b9cb  SistemaTemperatura-Instalador.exe" | sha256sum --check
      - name: Upload complete installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.0
        run: gh release upload "$TAG" SistemaTemperatura-Instalador.exe --clobber