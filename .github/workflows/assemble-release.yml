name: Assemble and publish Windows installer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-release.yml
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Download release parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.1
        run: |
          mkdir parts
          gh release download "$TAG" --pattern 'SistemaTemperatura.part*' --dir parts
      - name: Join and verify installer
        run: |
          cat parts/SistemaTemperatura-v1.0.1.part01 parts/SistemaTemperatura-v1.0.1.part02 parts/SistemaTemperatura-v1.0.1.part03 > SistemaTemperatura-Instalador.exe
          test "$(stat -c%s SistemaTemperatura-Instalador.exe)" = "176067584"
          echo "6d29bdbf8c3b01a1aed773427061594138c539f5c9fd05e85a9b132f8a340c53  SistemaTemperatura-Instalador.exe" | sha256sum --check
      - name: Upload complete installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.0.0
        run: gh release upload "$TAG" SistemaTemperatura-Instalador.exe --clobber